<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comercio Burger & Fast Food</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <header>
        <h1>🍔 Comercio Burger </h1>
    </header>

    <main class="contenedor">
        
        <!-- SECCION 1: BOTONES DE CONSULTA -->
        <section class="tarjeta">
            <h2>Consultas al Servidor</h2>
            <div class="botones">
                <button id="btnMenu" class="btn btn-azul">Ver Menú Completo (INNER JOIN)</button>
                <button id="btnStats" class="btn btn-naranja">Ver Estadísticas (GROUP BY)</button>
            </div>
        </section>

        <!-- SECCION 2: FORMULARIO DE ALTA -->
        <section class="tarjeta">
            <h2>Agregar Nuevo Plato</h2>
            <form id="formularioComida">
                <div class="campo">
                    <label for="nombreComida">Nombre del Plato:</label>
                    <input type="text" id="nombreComida" placeholder="Ej: Hamburguesa Triple Cheddar">
                </div>
                <div class="campo">
                    <label for="precioComida">Precio ($):</label>
                    <input type="number" id="precioComida" step="0.01" placeholder="Ej: 7200">
                </div>
                <div class="campo">
                    <label for="categoriaId">Categoría:</label>
                    <select id="categoriaId">
                        <option value="">Seleccione una categoría...</option>
                        <option value="1">1 - Hamburguesas</option>
                        <option value="2">2 - Lomos</option>
                        <option value="3">3 - Wraps</option>
                        <option value="4">4 - Ensaladas</option>
                        <option value="5">5 - Bebidas</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-verde">Guardar Plato</button>
            </form>
            <p id="mensajeEstado"></p>
        </section>

        <!-- SECCION 3: RESULTADOS EN PANTALLA -->
        <section class="tarjeta">
            <h2>Resultados en Pantalla</h2>
            <div id="contenedorResultados">
                <p>Presione alguno de los botones superiores para cargar los datos.</p>
            </div>
        </section>

    </main>

    <script type="module" src="index.js"></script>
</body>
</html>
